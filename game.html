<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake Arcade</title>
<style>
  :root { --pink:#ff69b4; --purple:#9b5de5; --dark:#171326; --panel:#241d38; --mint:#9bf6d0; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:Arial, sans-serif; color:#fff;
    background:radial-gradient(circle at top, #45305f 0, #211a35 45%, #100d1c 100%);
  }
  .game { width:min(94vw,560px); text-align:center; }
  h1 { margin:0 0 8px; color:#ffb3d9; letter-spacing:2px; text-shadow:0 0 16px #ff69b4; }
  .subtitle { margin:0 0 18px; color:#ded3f2; }
  .stats { display:flex; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .stat { flex:1; padding:10px; background:#241d38; border:1px solid #6c4a91; border-radius:12px; }
  .stat strong { display:block; color:#ffb3d9; font-size:1.25rem; margin-top:3px; }
  canvas { width:100%; height:auto; display:block; background:#100d1c; border:3px solid #ff69b4; border-radius:14px; box-shadow:0 0 24px #ff69b455; }
  .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; margin:14px 0; }
  button { border:0; border-radius:10px; padding:10px 16px; color:#1b1428; background:#ffb3d9; font-weight:bold; cursor:pointer; }
  button:hover { filter:brightness(1.08); transform:translateY(-1px); }
  #message { min-height:24px; color:#d9c8f5; margin:8px 0; }
  .help { color:#cfc3df; font-size:.9rem; line-height:1.5; }
  .mobile-controls { display:grid; grid-template-columns:repeat(3,52px); gap:6px; justify-content:center; margin:12px auto; }
  .mobile-controls button { padding:12px 0; font-size:1.1rem; }
  .mobile-controls .empty { visibility:hidden; }
</style>
</head>
<body>
<main class="game">
  <h1>NEON SNAKE</h1>
  <p class="subtitle">Eat, grow, and beat your high score!</p>
  <section class="stats">
    <div class="stat">SCORE<strong id="score">0</strong></div>
    <div class="stat">HIGH SCORE<strong id="highScore">0</strong></div>
    <div class="stat">LEVEL<strong id="level">1</strong></div>
  </section>
  <canvas id="board" width="480" height="480" aria-label="Snake game board"></canvas>
  <div id="message">Press Start Game to play.</div>
  <div class="controls">
    <button id="startBtn">Start Game</button>
    <button id="pauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>
  </div>
  <div class="mobile-controls" aria-label="Touch controls">
    <button class="empty"> </button><button data-dir="up">▲</button><button class="empty"> </button>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <p class="help">Use the arrow keys or WASD to move. On a phone, use the direction buttons.<br>
  Collect pink food for points and golden bonus food for extra points. Avoid the walls and your own tail!</p>
</main>
<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('highScore');
  const levelEl = document.getElementById('level');
  const message = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  const tile = 24, tiles = canvas.width / tile;
  let snake, direction, nextDirection, food, bonus, score, level;
  let timer = null, running = false, paused = false, gameOver = false;
  let bonusTicks = 0;
  let highScore = Number(localStorage.getItem('neonSnakeHighScore') || 0);
  highEl.textContent = highScore;

  function randomCell() {
    return { x: Math.floor(Math.random() * tiles), y: Math.floor(Math.random() * tiles) };
  }
  function occupied(cell) {
    return snake.some(part => part.x === cell.x && part.y === cell.y);
  }
  function placeFood() {
    let cell;
    do { cell = randomCell(); } while (occupied(cell));
    return cell;
  }
  function reset() {
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    direction = {x:1,y:0};
    nextDirection = {x:1,y:0};
    score = 0; level = 1; bonus = null; bonusTicks = 0;
    food = placeFood();
    running = false; paused = false; gameOver = false;
    scoreEl.textContent = score; levelEl.textContent = level;
    message.textContent = 'Press Start Game to play.';
    clearInterval(timer); timer = null;
    draw();
  }
  function setSpeed() {
    clearInterval(timer);
    timer = setInterval(update, Math.max(65, 145 - (level - 1) * 10));
  }
  function start() {
    if (gameOver) reset();
    if (running && paused) { paused = false; message.textContent = 'Keep going!'; setSpeed(); return; }
    if (running) return;
    running = true; paused = false;
    message.textContent = 'Good luck!';
    setSpeed();
  }
  function endGame(won = false) {
    clearInterval(timer); timer = null; running = false; paused = false; gameOver = true;
    message.textContent = won ? 'You Win! You filled the board!' : 'Game over! Press Restart to try again.';
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('neonSnakeHighScore', String(highScore));
      highEl.textContent = highScore;
    }
    draw();
  }
  function update() {
    if (!running || paused || gameOver) return;
    direction = nextDirection;
    const head = {x:snake[0].x + direction.x, y:snake[0].y + direction.y};
    if (head.x < 0 || head.x >= tiles || head.y < 0 || head.y >= tiles ||
        snake.some(part => part.x === head.x && part.y === head.y)) {
      endGame(); return;
    }
    snake.unshift(head);
    let ate = false;
    if (head.x === food.x && head.y === food.y) {
      score += 10; ate = true; food = placeFood();
      if (score % 50 === 0) { level++; levelEl.textContent = level; setSpeed(); }
      if (!bonus && Math.random() < 0.35) { bonus = placeFood(); bonusTicks = 55; }
    }
    if (bonus) {
      if (head.x === bonus.x && head.y === bonus.y) {
        score += 30; ate = true; bonus = null; bonusTicks = 0;
      } else {
        bonusTicks--;
        if (bonusTicks <= 0) bonus = null;
      }
    }
    scoreEl.textContent = score;
    if (!ate) snake.pop();
    if (snake.length >= tiles * tiles) { endGame(true); return; }
    draw();
  }
  function drawCell(cell, color, inset=2) {
    ctx.fillStyle = color;
    ctx.shadowColor = color; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.roundRect(cell.x * tile + inset, cell.y * tile + inset, tile - inset*2, tile - inset*2, 6);
    ctx.fill(); ctx.shadowBlur = 0;
  }
  function draw() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#100d1c'; ctx.fillRect(0,0,canvas.width,canvas.height);
    // Subtle grid
    ctx.strokeStyle = '#2a2140'; ctx.lineWidth = 1;
    for (let i=0;i<=tiles;i++) {
      ctx.beginPath(); ctx.moveTo(i*tile,0); ctx.lineTo(i*tile,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*tile); ctx.lineTo(canvas.width,i*tile); ctx.stroke();
    }
    // Fading trail behind the snake
    snake.forEach((part,index) => {
      const fade = Math.max(0.25, 1 - index / (snake.length + 5));
      ctx.globalAlpha = fade;
      drawCell(part, index === 0 ? '#9bf6d0' : '#ff69b4', 2);
    });
    ctx.globalAlpha = 1;
    drawCell(food, '#ff4f9a', 4);
    if (bonus) {
      drawCell(bonus, '#ffd166', 3);
      ctx.fillStyle = '#fff4c2'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center';
      ctx.fillText('+', bonus.x*tile+tile/2, bonus.y*tile+tile/2+5);
    }
    if (paused || gameOver) {
      ctx.fillStyle = '#100d1cbb'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 30px Arial';
      ctx.fillText(paused ? 'PAUSED' : (score >= 0 ? (snake.length >= tiles*tiles ? 'YOU WIN!' : 'GAME OVER') : ''), canvas.width/2, canvas.height/2);
    }
  }
  function changeDirection(dir) {
    const map = {
      up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}
    };
    const candidate = map[dir];
    if (!candidate) return;
    if (candidate.x === -direction.x && candidate.y === -direction.y) return;
    nextDirection = candidate;
  }
  document.addEventListener('keydown', e => {
    const keys = {ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',
      ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};
    if (keys[e.key]) { e.preventDefault(); changeDirection(keys[e.key]); }
    if (e.key === ' ' || e.key === 'Escape') { e.preventDefault(); togglePause(); }
  });
  document.querySelectorAll('[data-dir]').forEach(btn =>
    btn.addEventListener('click', () => changeDirection(btn.dataset.dir))
  );
  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    if (paused) { clearInterval(timer); message.textContent = 'Game paused.'; }
    else { message.textContent = 'Keep going!'; setSpeed(); }
    draw();
  }
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
